# Local synthetic test candidate. No API or automatic media approval.
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 2
Foreground yes
TCPSocket 3310
TCPAddr 127.0.0.1
TemporaryDirectory /tmp
LogClean no
LogVerbose no
LogSyslog no
ExtendedDetectionInfo no
Debug no
LeaveTemporaryFiles no
GenerateMetadataJson no
DisableCache yes
ConcurrentDatabaseReload no
SelfCheck 0
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 4
ReadTimeout 30
CommandReadTimeout 5
SendBufTimeout 1000
StreamMaxLength 50M
MaxFileSize 50M
MaxScanSize 100M
MaxRecursion 8
MaxFiles 1000
MaxScanTime 30000
PCREMatchLimit 100000
PCRERecMatchLimit 2000
PCREMaxFileSize 50M
AlertExceedsMax yes
AlertBrokenMedia yes
AlertEncrypted yes
ExitOnOOM yes
