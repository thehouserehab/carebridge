# Signature-only updater: receives no clinical/user files.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
ScriptedUpdates yes
TestDatabases yes
ConnectTimeout 15
ReceiveTimeout 60
MaxAttempts 1
LogVerbose no
LogSyslog no
